# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # 04:00 UTC is 07:00 in Nairobi, before most shops open.
  low_stock_digest:
    class: LowStockDigestJob
    schedule: every day at 4am

  # Yesterday's figures to owners, managers and accountants, after the low-stock digest.
  daily_summary:
    class: DailySummaryJob
    schedule: every day at 4:15am

  # The platform's own checks (database, workers, stuck or failed jobs, eTIMS queues, backups, disk), alerting
  # the operators when one fails (docs/RUNBOOK.md, "Alerts").
  platform_health:
    class: PlatformHealthJob
    schedule: every 10 minutes

  # Sales still waiting to reach KRA eTIMS.
  etims_retry:
    class: Etims::RetryJob
    schedule: every 5 minutes

  # Sales, voids and returns that were never queued for KRA eTIMS (the app stopped part-way).
  etims_reconcile:
    class: Etims::ReconcileJob
    schedule: every hour at minute 25

  # The day's market exchange rates; 06:30 in Nairobi, after the feed's daily update.
  exchange_rates:
    class: ExchangeRatesJob
    schedule: every day at 3:30am


  # Trial reminders, monthly invoices, payment reminders and read-only mode for unpaid shops.
  billing:
    class: BillingJob
    schedule: every day at 5am

  # Exports past their week are deleted, and so are shops 30 days after an owner closed them.
  account_maintenance:
    class: AccountMaintenanceJob
    schedule: every day at 1am

  # Shops' own scheduled backups, each at 02:00 in the shop's time zone; a missed hour is caught up.
  account_backups:
    class: AccountBackupScheduleJob
    schedule: every hour at minute 5

  # Webhook deliveries waiting to be retried.
  webhook_retry:
    class: WebhookRetryJob
    schedule: every minute
