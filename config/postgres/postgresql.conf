# PostgreSQL 18 for HardPoint on one Contabo VPS shared with the app (sized for a Cloud VPS 20:
# 6 vCPU, 12 GB RAM, NVMe). Worked out with pgtune ("web application", 8 GB left for Postgres after
# the app's Puma workers and Solid Queue). Mounted by the Kamal "db" accessory and loaded with
# `postgres -c config_file=/etc/postgresql/postgresql.conf`. Re-run pgtune when the VPS changes size.

listen_addresses = '*'            # only published on 127.0.0.1 and the Kamal Docker network (config/deploy.yml)
port = 5432

# Connections. A Puma thread holds at most one connection per database, so a web server needs up to
# WEB_CONCURRENCY × RAILS_MAX_THREADS × 4 databases (app, cache, queue, cable). Solid Queue needs
# JOB_CONCURRENCY × (JOB_THREADS + 2) × 3 (app, queue, cache) plus the dispatcher and supervisor.
#   One server (config/deploy.yml):      6 × 3 × 4 = 72 + 1 × 5 × 3 + ~6 ≈ 95
#   Scaled (config/deploy.scaled.yml): 2 × 72 = 144 + 3 × 5 × 3 + ~6 ≈ 195 (reports go to the replica)
# 250 covers both with room for consoles, backups and replication. Beyond that, put PgBouncer in
# front (docs/PLAN.md backlog) rather than raising this: each connection costs memory.
max_connections = 250
superuser_reserved_connections = 3

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 8MB                    # per sort/hash, per query; reports sort a year of lines comfortably
huge_pages = try

# Write-ahead log and checkpoints
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_compression = zstd

# Planner (NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Parallel queries
max_worker_processes = 6
max_parallel_workers_per_gather = 2
max_parallel_workers = 6
max_parallel_maintenance_workers = 2

# Query statistics for the platform admin's Database page
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on

# Safety
idle_in_transaction_session_timeout = 60s   # a stuck transaction can't hold locks for ever
lock_timeout = 10s                          # migrations wait at most this long for a lock

# Logging (to the container's stdout: `bin/kamal accessory logs db`)
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '

# Autovacuum: the busiest tables (sale_lines, stock_movements, events) grow steadily.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

timezone = 'UTC'

# Replication, for a read replica (config/deploy.scaled.yml). Harmless on a single server.
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
max_slot_wal_keep_size = 20GB        # a replica that's gone for good can't fill the primary's disk
# On the replica: long report queries aren't cancelled by the primary's cleanup (it's told what
# the replica still reads), and replay waits up to 5 minutes for a running report to finish.
hot_standby_feedback = on
max_standby_streaming_delay = 5min
