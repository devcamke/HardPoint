# Name of your application. Used to uniquely configure containers.
service: hardpoint

# Name of the container image (use your-user/app-name on external registries).
image: hardpoint

# The server's address stays out of the repository (it's public). It comes from HARDPOINT_HOST, or from the
# first line of .kamal/host, which git ignores: echo 203.0.113.10 > .kamal/host
<% host = ENV["HARDPOINT_HOST"].to_s.strip
   host = File.read(".kamal/host").lines.first.to_s.strip if host.empty? && File.exist?(".kamal/host")
   abort "Set HARDPOINT_HOST, or put the server's address in .kamal/host" if host.empty? %>

# Deploy to these servers.
servers:
  web:
    - <%= host %> # A Contabo VPS, shared for now with other apps
  # job:
  #   hosts:
  #     - <%= host %>
  #   cmd: bin/jobs

# Every shop is a subdomain, so the proxy answers for the bare domain and a wildcard.
# Let's Encrypt can't issue wildcards over HTTP, so TLS uses a Cloudflare Origin CA
# certificate covering hardpoint.app and *.hardpoint.app (Cloudflare SSL mode: Full (strict)).
# Requires config.assume_ssl and config.force_ssl in production.rb (both enabled).
proxy:
  hosts:
    - hardpoint.app
    - "*.hardpoint.app"
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERTIFICATE
    private_key_pem: CLOUDFLARE_ORIGIN_PRIVATE_KEY
  healthcheck:
    path: /up

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
# Migrations are not run by the containers: .kamal/hooks/pre-deploy runs them once per deploy.
env:
  secret:
    - RAILS_MASTER_KEY
    - HARDPOINT_DATABASE_PASSWORD
    # Optional: error reporting to Sentry (config/initializers/sentry.rb); without it errors are emailed
    # to ALERTS_EMAIL (config/initializers/error_reporting.rb). HEALTH_TOKEN lets the uptime monitor read
    # the details of /health. Add them to .kamal/secrets when set.
    # - SENTRY_DSN
    # - HEALTH_TOKEN
  clear:
    APP_HOST: hardpoint.app
    DATABASE_HOST: hardpoint-db
    # Where alerts (failed checks, errors without Sentry) are emailed; defaults to SUPPORT_EMAIL.
    # ALERTS_EMAIL: ops@hardpoint.app

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Two Puma workers, 3 threads each, while the VPS (4 vCPU, 8 GB) is shared with other apps.
    # On a dedicated Cloud VPS 20, go back to one worker per core (6); see config/postgres/postgresql.conf.
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 3

    # Match this to any external database server to configure Active Record correctly
    # Use hardpoint-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "hardpoint_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.3.6
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:18
    host: <%= host %> # Same VPS to start with; move to its own server when load demands it.
    # Only reachable from the server itself (and the app over the kamal Docker network).
    # Published on 5434 because other apps' databases on this VPS already hold 5432 and 5433;
    # the app connects to hardpoint-db:5432 over the Docker network, so only host-side tools see 5434.
    port: "127.0.0.1:5434:5432"
    env:
      clear:
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
        - HARDPOINT_DATABASE_PASSWORD
    # Tuned settings (config/postgres/postgresql.conf); the data directory keeps its own pg_hba.conf.
    cmd: postgres -c config_file=/etc/postgresql/postgresql.conf
    files:
      # Creates the non-superuser "hardpoint" role the app connects as, so row-level security applies.
      - config/postgres/create_app_role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh
      - config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    directories:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker inside this volume.
      - data:/var/lib/postgresql
