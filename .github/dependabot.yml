# Weekly dependency updates. Patch and minor gem updates arrive as one grouped pull request so CI
# checks them together; majors come one at a time. The Ruby base image in the Dockerfile is watched too.
# (Importmap-pinned JavaScript isn't covered by Dependabot: `bin/importmap outdated` and the weekly
# `bin/importmap audit` in CI cover it.)
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  groups:
    gems-minor-and-patch:
      update-types: [ minor, patch ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    day: monday
