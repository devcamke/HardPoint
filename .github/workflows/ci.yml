name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Weekly, so newly published advisories for gems and pinned JavaScript show up without a commit.
  schedule:
    - cron: "0 5 * * 1"

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  scan_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Brakeman and bundler-audit cover the code and the gems; this covers the operating system packages in the
      # image HardPoint ships in (the Dockerfile's Ruby base image), weekly as well, so a vulnerable OpenSSL in
      # the base image is caught before it's deployed. Only fixable high and critical findings fail the build.
      - name: Read the Ruby base image from the Dockerfile
        id: base
        run: echo "image=docker.io/library/ruby:$(sed -n 's/^ARG RUBY_VERSION=//p' Dockerfile)-slim" >> "$GITHUB_OUTPUT"

      - name: Scan the base image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.base.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The offline till's arithmetic and receipt printing; no packages needed.
      - name: Run JavaScript tests
        run: node --test test/javascript/*.mjs

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Superusers bypass row-level security, so tests connect as a regular role.
      - name: Create application database role
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE hardpoint LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS PASSWORD 'hardpoint'" -c "CREATE ROLE hardpoint_search NOLOGIN BYPASSRLS" -c "GRANT hardpoint_search TO hardpoint"

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://hardpoint:hardpoint@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  accessibility:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create application database roles
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE hardpoint LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS PASSWORD 'hardpoint'" -c "CREATE ROLE hardpoint_search NOLOGIN BYPASSRLS" -c "GRANT hardpoint_search TO hardpoint"

      # The demo shop, served by the app itself, scanned screen by screen with axe-core (script/accessibility_check.mjs).
      - name: Seed the demo shop and start the app
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://hardpoint:hardpoint@localhost:5432
        run: |
          SEED_DEMO=1 bin/rails db:prepare db:seed:replant
          bin/rails server -p 3000 -d
          for i in $(seq 1 30); do curl -fs http://localhost:3000/up > /dev/null && break; sleep 1; done

      - name: Scan the main screens for accessibility violations
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
          node script/accessibility_check.mjs

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Superusers bypass row-level security, so tests connect as a regular role.
      - name: Create application database role
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE hardpoint LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS PASSWORD 'hardpoint'" -c "CREATE ROLE hardpoint_search NOLOGIN BYPASSRLS" -c "GRANT hardpoint_search TO hardpoint"

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://hardpoint:hardpoint@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
